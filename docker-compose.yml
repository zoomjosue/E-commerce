services:
  db:
    image: mariadb:11
    container_name: tienda_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootsecret
      MARIADB_DATABASE: tienda_deportes
      MARIADB_USER: proy2
      MARIADB_PASSWORD: secret

    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

    ports:
      - "3307:3306"

  backend:
    build:
      context: ./backend
    container_name: tienda_backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    env_file: .env

    environment:
      DB_HOST: db

    ports:
      - "3001:3000"

  frontend:
    build:
      context: ./frontend

    container_name: tienda_frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5174:80"

volumes:
  db_data: